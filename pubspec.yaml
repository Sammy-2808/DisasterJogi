name: mesh_rescue
description: "Offline peer-to-peer disaster mesh communication app for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  cryptography: ^2.9.0
  geolocator: ^14.1.2
  uuid: ^4.6.0
  nearby_connections: ^4.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_secure_storage: ^11.2.0
  permission_handler: ^12.0.1
  dart_geohash: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: any
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/trusted_responders.json
